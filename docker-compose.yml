services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      NETDATA_URL: ${DASHBOARD_NETDATA_URL:-http://host.docker.internal:19999}
      PIHOLE_URL: ${DASHBOARD_PIHOLE_URL:-http://host.docker.internal:8080}
      QBITTORRENT_URL: ${DASHBOARD_QBITTORRENT_URL:-http://host.docker.internal:8181}
      SONARR_URL: ${DASHBOARD_SONARR_URL:-http://host.docker.internal:8989}
      RADARR_URL: ${DASHBOARD_RADARR_URL:-http://host.docker.internal:7878}
    ports:
      - "4000:4000"
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # OS updates via sudo will not work inside this container.
    # Run the backend with systemd on the host for /api/updates.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
